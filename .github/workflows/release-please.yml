name: Release Please
on:
  push:
    branches:
      - main
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Print all outputs
        run: |
          echo "===== Release Please Outputs ====="
          cat <<'EOF'
          ${{ toJson(steps.release.outputs) }}
          EOF
      - name: Print important outputs
        run: |
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "paths_released=${{ steps.release.outputs.paths_released }}"
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
  debug:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "needs.release-please.outputs.releases_created=${{ needs.release-please.outputs.releases_created }}"
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install
      - run: pnpm build
      - name: Publish to npm
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
