name: Release Please
on:
  push:
    branches: [main]
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.export.outputs.release_created }}
      tag_name: ${{ steps.export.outputs.tag_name }}
      version: ${{ steps.export.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Print release outputs for debugging
        continue-on-error: true
        run: |
          echo "Release outputs (write to file first):"
          echo '${{ toJson(steps.release.outputs) }}' > release-outputs.json
          cat release-outputs.json
      - name: Print specific outputs
        run: |
          echo "step .--release_created=${{ steps.release.outputs['.--release_created'] }}"
          echo "step .--tag_name=${{ steps.release.outputs['.--tag_name'] }}"
          # 新增中转步骤，把release输出导出到job作用域
      - name: Export vars for downstream jobs
        id: export
        run: |
          echo "release_created=${{ steps.release.outputs['.--release_created'] }}" >> $GITHUB_OUTPUT
          echo "tag_name=${{ steps.release.outputs['.--tag_name'] }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.release.outputs['.--version'] }}" >> $GITHUB_OUTPUT
      - name: Debug raw outputs
        run: |
          echo RAW: ${{ toJson(steps.release.outputs) }}
          echo .--release_created = ${{ steps.release.outputs['.--release_created'] }}
          echo .--tag_name = ${{ steps.release.outputs['.--tag_name'] }}
  debug:
    needs: release-please
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "release_created=${{ needs.release-please.outputs.release_created }}"
          echo "tag_name=${{ needs.release-please.outputs.tag_name }}"
          echo "version=${{ needs.release-please.outputs.version }}"
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install
      - run: pnpm build
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
